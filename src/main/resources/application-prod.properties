app.env=prod
logging.level.root=INFO
logging.level.com.csxuhuan.gelatoni=DEBUG
logging.level.org.springframework.web=DEBUG

# ========= Gelatoni Database (Primary) =========
spring.datasource.gelatoni.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.gelatoni.jdbc-url=jdbc:mysql://localhost:3306/gelatoni?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.gelatoni.username=${DB_USER}
spring.datasource.gelatoni.password=${DB_PASSWORD}

# ========= Ekiden Database =========
spring.datasource.ekiden.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.ekiden.jdbc-url=jdbc:mysql://localhost:3306/ekiden_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.ekiden.username=${DB_USER}
spring.datasource.ekiden.password=${DB_PASSWORD}

# ========= JWT =========
jwt.secret=${JWT_SECRET}
jwt.expiration-time=86400000

# ========= LLM =========
llm.base-url=${LLM_BASE_URL}
llm.api-key=${LLM_API_KEY}
llm.model=${LLM_MODEL}