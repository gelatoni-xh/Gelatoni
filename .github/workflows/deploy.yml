name: Build & Deploy Gelatoni

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch shared secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: prod
          secret-path: /shared
          export-type: env
          include-imports: true

      - name: Fetch gelatoni secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: prod
          secret-path: /gelatoni
          export-type: env
          include-imports: true

      - name: Verify Infisical secrets
        run: |
          if [ -z "$SERVER_HOST" ]; then
            echo "❌ SERVER_HOST not found"
            exit 1
          fi
          if [ -z "$SERVER_USER" ]; then
            echo "❌ SERVER_USER not found"
            exit 1
          fi
          if [ -z "$SERVER_PEM" ]; then
            echo "❌ SERVER_PEM not found"
            exit 1
          fi
          if [ -z "$DB_USER" ]; then
            echo "❌ DB_USER not found"
            exit 1
          fi
          if [ -z "$DB_PASSWORD" ]; then
            echo "❌ DB_PASSWORD not found"
            exit 1
          fi
          if [ -z "$JWT_SECRET" ]; then
            echo "❌ JWT_SECRET not found"
            exit 1
          fi
          echo "✅ All secrets retrieved successfully"

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '8'

      - name: Build with Maven
        run: ./mvnw clean package
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          JWT_SECRET: ${{ env.JWT_SECRET }}

      - name: Upload Jar to Server
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_PEM }}
          port: 22
          source: "target/gelatoni-0.0.1-SNAPSHOT.jar"
          target: ${{ vars.JAR_TARGET_PATH }}
          strip_components: 1

      - name: Create startup script and env file
        uses: appleboy/ssh-action@v0.1.7
        env:
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_PEM }}
          port: 22
          envs: DB_USER,DB_PASSWORD,JWT_SECRET
          script: |
            # Create .env file with secrets
            cat > /home/ubuntu/gelatoni/.env << EOF
            DB_USER=$DB_USER
            DB_PASSWORD=$DB_PASSWORD
            JWT_SECRET=$JWT_SECRET
            EOF
            chmod 600 /home/ubuntu/gelatoni/.env

            # Create startup script
            cat > /home/ubuntu/gelatoni/start.sh << 'SCRIPT'
            #!/bin/bash
            source /home/ubuntu/gelatoni/.env
            export DB_USER DB_PASSWORD JWT_SECRET
            cd /home/ubuntu/gelatoni
            java -jar gelatoni-0.0.1-SNAPSHOT.jar \
              --spring.profiles.active=prod
            SCRIPT
            chmod +x /home/ubuntu/gelatoni/start.sh

      - name: Update systemd service and restart
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_PEM }}
          port: 22
          script: |
            sudo systemctl daemon-reload
            sudo systemctl restart ${{ vars.SERVICE_NAME }}
            sudo systemctl status ${{ vars.SERVICE_NAME }} --no-pager
