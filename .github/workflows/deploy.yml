name: Build & Deploy Gelatoni

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch shared secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_ID }}
          env-slug: prod
          secret-path: /shared
          export-type: env

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '8'

      - name: Build with Maven
        run: ./mvnw clean package

      - name: Upload Jar to Server
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_PEM }}
          port: 22
          source: "target/gelatoni-0.0.1-SNAPSHOT.jar"
          target: ${{ vars.JAR_TARGET_PATH }}
          strip_components: 1

      - name: Restart Gelatoni Service
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_PEM }}
          port: 22
          script: |
            sudo systemctl restart ${{ vars.SERVICE_NAME }}
            sudo systemctl status ${{ vars.SERVICE_NAME }} --no-pager
